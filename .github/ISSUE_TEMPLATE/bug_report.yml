name: Bug Report
description: Reporter un bug dans LoL Arena Wins Tracker
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Décris clairement le problème
      placeholder: Quand je fais X, le comportement Y arrive...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur...
        2. Cliquer sur...
        3. Observer...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportement actuel
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Navigateur
      placeholder: "Ex: Chrome 122, Firefox 123"

  - type: textarea
    id: additional
    attributes:
      label: Informations additionnelles
      description: Logs, captures, contexte
